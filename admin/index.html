<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Hayso Admin</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Hayso app management dashboard (15 Nov 2026). Owner-only. Same look as the website and clinic dashboard. */
:root{--paper:#F3F2EF;--ink:#18211F;--petrol:#1F3A38;--muted:#5E6866;--faint:#9AA3A0;--line:rgba(24,33,31,.09);
  --blue:#5FB4F0;--lilac:#9C8CF2;--pink:#F29BC0;--good:#2E9C7E;--warn:#C98A2B}
*{box-sizing:border-box}
body{margin:0;font-family:'DM Sans',system-ui,-apple-system,sans-serif;color:var(--ink);font-weight:400;line-height:1.45;min-height:100vh;
  background:radial-gradient(circle at 6% 4%,#D3EEE4 0,rgba(211,238,228,0) 34%),radial-gradient(circle at 96% 8%,#E9DFF8 0,rgba(233,223,248,0) 36%),radial-gradient(circle at 8% 98%,#F7E6D8 0,rgba(247,230,216,0) 34%),var(--paper);background-attachment:fixed}
.glass{background:rgba(255,255,255,.62);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);
  border:1px solid rgba(255,255,255,.85);border-radius:22px;box-shadow:0 18px 32px -14px rgba(28,52,49,.22),0 2px 6px rgba(28,52,49,.06)}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
button,input,select{font:inherit;color:inherit}
.btn{border:0;border-radius:999px;background:var(--petrol);color:#fff;padding:12px 22px;font-weight:600;cursor:pointer}
.btn.ghost{background:rgba(255,255,255,.8);color:var(--ink);border:1px solid var(--line)}
.field{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.9);outline:none}
.field:focus{border-color:var(--lilac)}
.small{font-size:13px;color:var(--muted)}
.err{color:var(--ink);background:rgba(242,155,192,.18);border-radius:12px;padding:10px 14px;font-size:14px}
/* sign in */
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
#login .glass{width:100%;max-width:400px;padding:30px}
.wmk{display:inline-flex;align-items:baseline;font-weight:800;letter-spacing:-.05em;line-height:1;color:#1B2D2B;white-space:nowrap}
.mark{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.03em}
.ring{width:28px;height:28px;border-radius:50%;background:conic-gradient(var(--blue),var(--lilac),var(--pink),var(--blue));
  -webkit-mask:radial-gradient(circle,transparent 8px,#000 9px);mask:radial-gradient(circle,transparent 8px,#000 9px);filter:drop-shadow(0 0 6px rgba(156,140,242,.55))}
/* app */
#app{display:none;min-height:100vh}
.side{position:fixed;inset:16px auto 16px 16px;width:220px;padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.side .mark{padding:4px 8px 18px}
.nav{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.nav:hover{background:rgba(255,255,255,.6)}
.nav.on{background:#fff;box-shadow:0 6px 16px -8px rgba(28,52,49,.3);font-weight:600}
.nav .n{margin-left:auto;font-size:12px;background:var(--lilac);color:#fff;border-radius:99px;padding:1px 8px;font-weight:700}
.side .foot{margin-top:auto;padding:8px}
main{margin-left:252px;padding:28px 28px 60px;max-width:1240px}
.top{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px}
.top h1{font-size:32px}
.top .small{margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{padding:18px 20px}
.kpi .v{font-size:34px;font-weight:800;letter-spacing:-.03em;margin-top:4px}
.kpi .s{font-size:13px;color:var(--muted)}
.panel{padding:20px 22px;margin-top:14px}
.panel h2{font-size:18px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;align-items:start}
.chart{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar .b{width:100%;max-width:26px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--lilac),var(--blue));min-height:3px}
.bar .b2{width:60%;max-width:14px;border-radius:6px;background:var(--pink);min-height:0}
.bar span{font-size:11px;color:var(--faint)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(24,33,31,.06)}
.chip.bug{background:rgba(242,155,192,.22)}.chip.idea{background:rgba(95,180,240,.2)}
.chip.new{background:rgba(156,140,242,.22)}.chip.in_progress{background:rgba(201,138,43,.18)}.chip.fixed{background:rgba(46,156,126,.18)}
.chip.on{background:var(--petrol);color:#fff}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:rgba(255,255,255,.7);border-radius:99px;padding:7px 14px;cursor:pointer;font-size:14px}
.tabs button.on{background:var(--petrol);color:#fff;border-color:var(--petrol)}
.fb{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:10px}
.fb:last-child{border-bottom:0}
.fb p{margin:6px 0 0;font-size:15px}
.fb select{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff;align-self:start}
.chat{padding:14px 0;border-bottom:1px solid var(--line)}
.chat:last-child{border-bottom:0}
.q{font-weight:600}
.a{margin-top:6px;color:var(--muted);font-size:14px;white-space:pre-wrap}
.empty{padding:30px;text-align:center;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
/* fold-out cards (17 Nov): groups start closed, tap to open, 5 rows then Show more */
.fold{padding:0;margin-top:12px;overflow:hidden}
.fold-h{display:flex;align-items:center;gap:14px;width:100%;padding:18px 22px;border:0;background:none;cursor:pointer;text-align:left}
.fold-h:hover{background:rgba(255,255,255,.4)}
.fold-h .t{font-size:18px;font-weight:800;letter-spacing:-.02em}
.fold-h .sub{font-size:13px;color:var(--muted)}
.fold-h .cnt{margin-left:auto;font-size:22px;font-weight:800;letter-spacing:-.03em}
.chev{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(24,33,31,.05);transition:transform .2s}
.fold.open .fold-h .chev,.fbi.open .fbi-h .chev{transform:rotate(90deg)}
.fbi-h .chev{width:24px;height:24px}
.fold-b{padding:0 22px 14px}
.tdot{width:12px;height:12px;border-radius:50%;flex:none}
.hb{padding:22px 24px;display:flex;align-items:center;gap:16px}
.hb .big{font-size:26px;font-weight:800;letter-spacing:-.02em}
.hdot{width:18px;height:18px;border-radius:50%;flex:none}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.htile{padding:16px 18px}
.htile .nm{font-weight:700;display:flex;align-items:center;gap:8px}
.htile .why{font-size:13px;margin-top:6px}
.tl{display:flex;gap:2px;height:34px;align-items:stretch;margin-top:6px}
.tl i{flex:1;border-radius:3px;background:rgba(46,156,126,.55)}
.tl i.bad{background:var(--pink)}.tl i.none{background:rgba(24,33,31,.08)}
@media (max-width:900px){.hgrid{grid-template-columns:1fr 1fr}}
.newn{font-size:12px;font-weight:700;color:#fff;background:var(--lilac);border-radius:99px;padding:1px 8px}
.more{display:block;margin:10px auto 2px;padding:7px 18px;font-size:13px}
.fbi{padding:12px 0;border-bottom:1px solid var(--line)}
.fbi:last-child{border-bottom:0}
.fbi-h{display:flex;align-items:center;gap:10px;cursor:pointer}
.fbi-h .txt{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbi.open .fbi-h .txt{white-space:normal}
.fbi-b{padding:8px 0 4px 0}
@media (max-width:900px){
  .side{position:static;width:auto;margin:16px;flex-direction:row;flex-wrap:wrap;align-items:center}
  .side .mark{padding:4px 8px}.side .foot{margin:0 0 0 auto}
  .nav{width:auto}
  main{margin:0;padding:8px 16px 40px}
  .kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.grid2e{grid-template-columns:1fr}.kpis.k3{grid-template-columns:1fr}
  .wide{overflow-x:auto}
}
.sec{display:flex;align-items:baseline;gap:12px;margin:30px 0 0}.sec h2{font-size:22px;letter-spacing:-.02em}
.grid2e{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.kpis.k3{grid-template-columns:repeat(3,1fr);margin-top:14px}
.hb2{display:grid;grid-template-columns:minmax(120px,38%) 1fr auto;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.hb2-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hb2-t{height:10px;border-radius:5px;background:rgba(24,33,31,.06);overflow:hidden}.hb2-t i{display:block;height:100%;border-radius:5px}
.hb2-v{font-weight:700;white-space:nowrap}.hb2-v span{font-weight:400;color:var(--muted);font-size:12px}
.fn{display:grid;grid-template-columns:minmax(130px,32%) 1fr 118px;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.fn-t{height:22px;border-radius:8px;background:rgba(24,33,31,.05);overflow:hidden}.fn-t i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--blue),var(--lilac),var(--pink))}
.fn-v{font-weight:700;text-align:right}.fn-v span{display:block;font-weight:400;font-size:12px;color:var(--muted)}.fn-v span.bad{color:#B4476F;font-weight:600}
.stack{width:100%;max-width:26px;display:flex;flex-direction:column;border-radius:8px 8px 4px 4px;overflow:hidden;min-height:3px;background:rgba(24,33,31,.06)}.stack i{display:block;min-height:0}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.money b{font-size:26px;letter-spacing:-.02em}
</style>
</head>
<body>

<!-- sign in -->
<section id="login">
  <div class="glass">
    <div class="mark"><span class="wmk" role="img" aria-label="hayso" style="font-size:30px"><span aria-hidden="true">hays</span><svg viewBox="0 0 100 100" aria-hidden="true" style="width:.531em;height:.531em;margin-left:.075em;position:relative;top:.015em;overflow:visible"><defs><linearGradient id="awm1" x1="0" y1="0" x2="1" y2="1"><stop offset=".12" stop-color="#5FB4F0"/><stop offset=".5" stop-color="#9C8CF2"/><stop offset=".88" stop-color="#F29BC0"/></linearGradient></defs><path d="M 47.19 12.61 A 37.5 37.5 0 1 1 12.61 47.16" fill="none" stroke="url(#awm1)" stroke-width="25" stroke-linecap="round"/></svg></span> <span class="small" style="font-weight:600;margin-left:4px">Admin</span></div>
    <h1 id="loginTitle" style="font-size:26px;margin:22px 0 4px">Sign in</h1>
    <p class="small" id="loginSub" style="margin:0 0 18px">App management for the Hayso team.</p>
    <form id="signin">
      <input class="field" id="email" type="email" placeholder="Email" autocomplete="username" required>
      <input class="field" id="pw" type="password" placeholder="Password" autocomplete="current-password" required style="margin-top:10px">
      <div id="loginErr" class="err" style="display:none;margin-top:12px"></div>
      <button class="btn" style="width:100%;margin-top:16px" type="submit">Sign in</button>
      <p style="text-align:center;margin:14px 0 0"><a href="#" id="forgot" class="small">Forgot password?</a></p>
    </form>
    <form id="setpw" style="display:none">
      <input class="field" id="pw1" type="password" placeholder="New password (8+ characters)" autocomplete="new-password" minlength="8" required>
      <div id="setErr" class="err" style="display:none;margin-top:12px"></div>
      <button class="btn" style="width:100%;margin-top:16px" type="submit">Save password</button>
    </form>
  </div>
</section>

<!-- dashboard -->
<section id="app">
  <aside class="side glass">
    <div class="mark"><span class="wmk" role="img" aria-label="hayso" style="font-size:28px"><span aria-hidden="true">hays</span><svg viewBox="0 0 100 100" aria-hidden="true" style="width:.531em;height:.531em;margin-left:.075em;position:relative;top:.015em;overflow:visible"><defs><linearGradient id="awm2" x1="0" y1="0" x2="1" y2="1"><stop offset=".12" stop-color="#5FB4F0"/><stop offset=".5" stop-color="#9C8CF2"/><stop offset=".88" stop-color="#F29BC0"/></linearGradient></defs><path d="M 47.19 12.61 A 37.5 37.5 0 1 1 12.61 47.16" fill="none" stroke="url(#awm2)" stroke-width="25" stroke-linecap="round"/></svg></span></div>
    <button class="nav on" data-v="overview">Overview</button>
    <button class="nav" data-v="health">App health <span class="n" id="hN" style="display:none;background:var(--warn)">!</span></button>
    <button class="nav" data-v="users">Users</button>
    <button class="nav" data-v="subs">Subscribers</button>
    <button class="nav" data-v="feedback">Feedback <span class="n" id="fbN" style="display:none"></span></button>
    <button class="nav" data-v="errors">App errors <span class="n" id="erN" style="display:none"></span></button>
    <button class="nav" data-v="usage">Usage</button>
    <button class="nav" data-v="chats">hayso chats</button>
    <button class="nav" data-v="library">Library <span class="n" id="libN" style="display:none"></span></button>
    <div class="foot"><div class="small" id="who"></div><a href="#" id="signout" class="small">Sign out</a></div>
  </aside>
  <main id="main"></main>
</section>

<script>
// Publishable key only (safe in a web page). Every read is checked server-side: only emails in app_admins get data.
const SB = supabase.createClient('https://hjscmvavrlxzxqirrdfb.supabase.co', 'sb_publishable_cbrqyUE_ZhBqKfF0HQCj3Q_wj2rrvfU');
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => Number(n ?? 0).toLocaleString('en-GB');
const when = (iso) => iso ? new Date(iso).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '–';
const ago = (iso) => { if (!iso) return 'Never'; const m = (Date.now() - new Date(iso)) / 60000; return m < 60 ? `${Math.max(1, Math.round(m))} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
const short = (id) => id ? String(id).slice(0, 8) : '–';
const PLAN = { none: 'No plan', trial: 'Trial', monthly: 'Monthly', annual: 'Annual', clinic: 'Clinic' };
let view = 'overview', data = {}, fbFilter = 'new', hideNoise = true, userQ = '', busyAi = {}, errAi = {};

// ---------- sign in ----------
function showErr(el, msg) { el.textContent = msg; el.style.display = msg ? 'block' : 'none'; }
$('#signin').onsubmit = async (e) => {
  e.preventDefault(); showErr($('#loginErr'), '');
  const { error } = await SB.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#pw').value });
  if (error) return showErr($('#loginErr'), 'That email and password don’t match.');
  start();
};
$('#forgot').onclick = async (e) => {
  e.preventDefault();
  const email = $('#email').value.trim();
  if (!email) return showErr($('#loginErr'), 'Type your email first, then tap Forgot password.');
  await SB.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  showErr($('#loginErr'), 'If that email has access, a reset link is on its way.');
};
$('#setpw').onsubmit = async (e) => {
  e.preventDefault();
  const { error } = await SB.auth.updateUser({ password: $('#pw1').value });
  if (error) return showErr($('#setErr'), error.message);
  history.replaceState(null, '', location.pathname); start();
};
$('#signout').onclick = async (e) => { e.preventDefault(); await SB.auth.signOut(); location.reload(); };
SB.auth.onAuthStateChange((ev) => {
  if (ev === 'PASSWORD_RECOVERY') {
    $('#signin').style.display = 'none'; $('#setpw').style.display = 'block';
    $('#loginTitle').textContent = 'Set your password'; $('#loginSub').textContent = 'Pick a password for the admin dashboard.';
  }
});

async function start() {
  const { data: s } = await SB.auth.getSession();
  if (!s.session) return;
  const { data: ok } = await SB.rpc('is_app_admin');
  if (!ok) { await SB.auth.signOut(); return showErr($('#loginErr'), 'This account doesn’t have admin access.'); }
  $('#login').style.display = 'none'; $('#app').style.display = 'block';
  $('#who').textContent = s.session.user.email;
  await load();
}

async function load() {
  const [o, u, f, c, er, us, ins] = await Promise.all([SB.rpc('admin_overview'), SB.rpc('admin_users'), SB.rpc('admin_feedback_v3'), SB.rpc('admin_chats'), SB.rpc('admin_errors'), SB.rpc('admin_usage'), SB.rpc('admin_insights', { p_days: insDays })]);
  const fb = f.error ? ((await SB.rpc('admin_feedback_v2')).data || []) : (f.data || []);
  data = { o: o.data || {}, users: u.data || [], fb, chats: c.data || [], errors: er.data || [], usage: us.data || {}, ins: ins.error ? null : ins.data, insErr: !!ins.error };
  const e7 = data.usage.errors_7d || 0; $('#erN').textContent = e7; $('#erN').style.display = e7 ? 'inline-block' : 'none';
  const n = data.fb.filter((x) => x.status === 'new' && !noise(x)).length;
  $('#fbN').textContent = n; $('#fbN').style.display = n ? 'inline-block' : 'none';
  render();
  hLoad();
}
let betaOnly = false, fbWho = null;
const openSet = new Set(), showN = {};
const tog = (k) => { openSet.has(k) ? openSet.delete(k) : openSet.add(k); render(); };
const moreBtn = (k, total) => { const n = showN[k] || 5; return total > n ? `<button class="btn ghost more" onclick="showN['${k}']=${n + 10};render()">Show ${Math.min(10, total - n)} more</button>` : ''; };
const chev = '<span class="chev"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
function fold(k, dot, title, sub, count, extra, body) {
  const on = openSet.has(k);
  return `<div class="glass fold${on ? ' open' : ''}"><button class="fold-h" onclick="tog('${k}')">${dot ? `<span class="tdot" style="background:${dot}"></span>` : ''}
    <div><div class="t">${title}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>${extra || ''}<span class="cnt">${count}</span>${chev}</button>
    ${on ? `<div class="fold-b">${body}</div>` : ''}</div>`;
}
// feedback topics, matched on the words people use. First match wins.
const TOPICS = [
  ['meals', 'Meals and portions', 'linear-gradient(135deg,#F7B6DA,#DE6CAE)', /meal|food|recipe|portion|gram|protein|calorie|breakfast|lunch|dinner|snack|eat|ingredient/i],
  ['logging', 'Logging', 'linear-gradient(135deg,#FBDDA2,#DE9C34)', /log|water|weigh|kg|track|symptom|side effect|jab|dose|pen/i],
  ['move', 'Workouts and movement', 'linear-gradient(135deg,#A8E6DA,#2FAE9A)', /workout|exercise|session|move|step|walk|gym|muscle/i],
  ['chat', 'hayso chat and support', 'linear-gradient(135deg,#D6C6FA,#9677DC)', /hayso|chat|ask|support|clinic|message|reply/i],
  ['home', 'Home, plan and score', 'linear-gradient(135deg,#B4CEFF,#5E8FE6)', /home|score|ring|plan|today|goal|progress|chart|graph/i],
  ['setup', 'Sign-in and setup', 'linear-gradient(135deg,#E6E3DD,#9AA3A0)', /sign|login|log in|account|onboard|setup|set up|password|email|notification/i],
];
const topicOf = (x) => (TOPICS.find((t) => t[3].test(x.text || '')) || ['other', 'Everything else', 'linear-gradient(135deg,#E6E3DD,#C9C4BC)'])[0];
const who = (x) => x.label || (x.email && !x.email.startsWith('Guest') ? x.email : 'Guest ' + short(x.user_id ?? x.id));
async function setLabel(id, label) {
  const { error } = await SB.rpc('admin_set_label', { uid: id, label });
  if (error) return document.querySelector('#main').insertAdjacentHTML('afterbegin', '<div class="err" style="margin-bottom:12px">Could not save the name. Try again.</div>');
  data.fb.forEach((x) => { if (x.user_id === id) x.label = label.trim() || null; }); render();
}
async function setBeta(id, on) {
  const { error } = await SB.rpc('admin_set_beta', { uid: id, is_beta: on });
  if (error) return document.querySelector('#main').insertAdjacentHTML('afterbegin', '<div class="err" style="margin-bottom:12px">Could not save. Try again.</div>');

// ---------- App health (17 Nov) ----------
// Server checks run every 5 minutes. Phones say start / ready / crash. Answers "is the app down, and why?"
const HNAMES = { database: 'Database', logins: 'Sign-in', hayso_chat: 'hayso chat', meal_scan: 'Meal photo scan', ai: 'AI (Claude)', sentry: 'Sentry crashes' };
let health = null, hBusy = false, hTimer = null;
async function hLoad() {
  const { data: h, error } = await SB.rpc('admin_health');
  health = error ? { error: error.message } : h;
  const p = hProblems(); $('#hN').style.display = p.length ? 'inline-block' : 'none';
  if (view === 'health') render();
  clearTimeout(hTimer); if (view === 'health') hTimer = setTimeout(hLoad, 60000); // live while the page is open
}
async function hCheck(btn) {
  hBusy = true; render();
  const { data: r, error } = await SB.functions.invoke('app-health', { body: {} });
  hBusy = false;
  if (error || r?.error) { health = { ...(health || {}), checkErr: 'Could not run the checks. The app-health function may be down or not set up yet.' }; return render(); }
  hLoad();
}
function hProblems() {
  const h = health; if (!h || h.error) return [];
  const out = [];
  (h.checks || []).filter((c) => !c.ok).forEach((c) => out.push(`${HNAMES[c.name] || c.name}: ${c.detail || 'failing'}`));
  if (h.last_run_at && Date.now() - new Date(h.last_run_at) > 12 * 60000) out.push(`Server checks stopped. Last ran ${ago(h.last_run_at)}`);
  (h.phones || []).forEach((p) => {
    const nm = p.platform === 'ios' ? 'iPhone' : p.platform === 'android' ? 'Android' : p.platform;
    if (p.starts_1h >= 2 && p.ready_1h === 0) out.push(`${nm} app is not opening: ${p.starts_1h} opens in the last hour, none reached the first screen`);
    else if (p.crash_1h) out.push(`${nm} app crashed ${p.crash_1h} ${p.crash_1h === 1 ? 'time' : 'times'} in the last hour`);
  });
  return out;
}
function hRender(m) {
  const h = health;
  if (!h) { m.innerHTML = head('App health', 'Loading…'); return; }
  if (h.error) { m.innerHTML = head('App health', '') + `<div class="panel glass empty">App health isn’t switched on yet. Ask Claude to apply the app health update.</div>`; return; }
  const probs = hProblems(), good = !probs.length, never = !h.last_run_at;
  const tile = (name, ok, line, why) => `<div class="glass htile"><div class="nm"><span class="hdot" style="width:12px;height:12px;background:${ok === null ? 'var(--faint)' : ok ? 'var(--good)' : 'var(--pink)'}"></span>${name}</div>
    <div class="small" style="margin-top:4px">${line}</div>${why ? `<div class="why">${why}</div>` : ''}</div>`;
  const phone = (key, nm) => { const p = (h.phones || []).find((x) => x.platform === key);
    if (!p) return tile(nm + ' app', null, 'No opens in 24h', '<span class="small">Pings start with the new build.</span>');
    const bad = (p.starts_1h >= 2 && p.ready_1h === 0) || p.crash_1h > 0;
    return tile(nm + ' app', !bad, `Last opened fine ${ago(p.last_ready)} · v${esc(p.version || '?')}`,
      `<span class="small">${fmt(p.starts_24h)} opens in 24h · ${fmt(p.stuck_24h)} didn’t open · ${fmt(p.crash_24h)} crashes</span>`); };
  const sentry = (h.checks || []).find((c) => c.name === 'sentry');
  const slots = []; const tl = h.timeline || [];
  for (let k = 95; k >= 0; k--) { const t = Math.floor((Date.now() - k * 900000) / 900000) * 900000;
    const b = tl.find((x) => Math.floor(new Date(x.t).getTime() / 900000) * 900000 === t);
    slots.push(`<i class="${!b ? 'none' : b.ok ? '' : 'bad'}" title="${new Date(t).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}${b ? (b.ok ? ': all fine' : ': ' + esc(HNAMES[b.failed] || b.failed)) : ': no check'}"></i>`); }
  const errs = [...(h.crashes || []).map((c) => ({ ...c, name: c.detail || 'App crashed', kind: 'Crash' })), ...(h.errors || []).map((e) => ({ ...e, kind: 'Error' }))];
  m.innerHTML = head('App health', `Live. Checks every 5 min${h.last_run_at ? ' · last ' + ago(h.last_run_at) : ''}`) +
    `<div class="glass hb"><span class="hdot" style="background:${never ? 'var(--faint)' : good ? 'var(--good)' : 'var(--pink)'}"></span>
      <div style="flex:1"><div class="big">${never ? 'No checks yet' : good ? 'Everything is working' : probs.length === 1 ? 'Something is wrong' : probs.length + ' things are wrong'}</div>
      ${probs.map((x) => `<div style="margin-top:4px">${esc(x)}</div>`).join('') || `<div class="small" style="margin-top:4px">${never ? 'Press Check now, or wait for the first 5-minute check.' : 'Servers, sign-in, hayso chat, AI and phones all look fine.'}</div>`}
      ${h.checkErr ? `<div class="err" style="margin-top:8px">${esc(h.checkErr)}</div>` : ''}</div>
      <button class="btn" onclick="hCheck(this)" ${hBusy ? 'disabled' : ''}>${hBusy ? 'Checking…' : 'Check now'}</button></div>
    <div class="hgrid">
      ${['database', 'logins', 'hayso_chat', 'meal_scan', 'ai'].map((k) => { const c = (h.checks || []).find((x) => x.name === k);
        return c ? tile(HNAMES[k], c.ok, c.ok ? `Fine · ${fmt(c.ms)} ms` : `Down since at least ${ago(c.at)}`, c.ok ? '' : `<b>Cause:</b> ${esc(c.detail)}`) : tile(HNAMES[k], null, 'Not checked yet', ''); }).join('')}
      ${sentry ? tile('Sentry crashes', sentry.ok, esc(sentry.detail || ''), '') : tile('Sentry crashes', null, 'Not connected yet', '<span class="small">Add the Sentry keys and hard crashes show here too.</span>')}
      ${phone('ios', 'iPhone')}${phone('android', 'Android')}
    </div>
    <div class="panel glass"><div class="row"><h2 style="margin:0">Last 24 hours</h2><span class="small" style="margin-left:auto">Each block is 15 minutes. Pink = something failed. Hover to see what.</span></div>
      <div class="tl">${slots.join('')}</div>
      <div class="row small" style="justify-content:space-between;margin-top:4px"><span>24 h ago</span><span>Now</span></div></div>` +
    fold('h-errs', 'var(--pink)', 'Crashes and errors', 'From phones, last 24 hours. Newest first', fmt(errs.length), '',
      errs.length ? errs.slice(0, showN['h-errs'] || 5).map((e) => `<div class="fbi"><div class="row" style="flex-wrap:wrap"><span class="chip bug">${e.kind}</span>
        <span style="flex:1;min-width:200px;font-family:ui-monospace,Menlo,monospace;font-size:13px">${esc(e.name)}</span>
        <span class="small">${e.platform === 'ios' ? 'iPhone' : e.platform === 'android' ? 'Android' : esc(e.platform)} · v${esc(e.app_version || '?')} · ${fmt(e.n)}× · ${ago(e.last)}</span></div></div>`).join('') + moreBtn('h-errs', errs.length)
        + `<button class="btn ghost" style="margin-top:10px;padding:7px 16px;font-size:13px" onclick="go('errors')">Open App errors for stack traces and AI fixes</button>`
      : '<div class="empty">No crashes or errors in 24 hours.</div>') +
    fold('h-past', 'var(--faint)', 'Past problems', 'Failed checks, last 7 days', fmt((h.incidents || []).length), '',
      (h.incidents || []).length ? (h.incidents || []).slice(0, showN['h-past'] || 5).map((x) => `<div class="fbi"><div class="row"><b>${esc(HNAMES[x.check_name] || x.check_name)}</b>
        <span class="small" style="flex:1">${esc(x.detail || '')}</span><span class="small">${when(x.at)}</span></div></div>`).join('') + moreBtn('h-past', h.incidents.length)
      : '<div class="empty">No failed checks in 7 days.</div>');
}

    const f = libForm(S.k), drafts = lib.items.filter((i) => libSec(i) === S.k), lib2 = lib.approved.filter((i) => libSec(i) === S.k);
    const q = f.q.toLowerCase(), shown = lib2.filter((i) => !q || (i.title + ' ' + i.body + ' ' + (i.tags || []).join(' ')).toLowerCase().includes(q));
    const nLinks = f.links.split(/\n/).filter((x) => x.trim()).length;
    const sub = [['check', `To check ${drafts.length}`], ['lib', `Library ${lib2.length}`], ['new', '+ New scrape']];
    let inner = `<div class="tabs" style="margin:2px 0 14px">${sub.map(([t, l]) => `<button class="${f.sub === t ? 'on' : ''}" onclick="libForm('${S.k}').sub='${t}';render()">${l}</button>`).join('')}</div>`;
    if (f.sub === 'check') inner += drafts.length ? drafts.slice(0, showN['ld-' + S.k] || 5).map((i) => libCard(i, true)).join('') + moreBtn('ld-' + S.k, drafts.length)
      : `<div class="empty">Nothing to check here. <a href="#" onclick="libForm('${S.k}').sub='new';render();return false">Start a scrape</a></div>`;
    if (f.sub === 'lib') inner += `<input placeholder="Search ${esc(S.title.toLowerCase())}" value="${esc(f.q)}" oninput="libForm('${S.k}').q=this.value;render();this.focus();this.setSelectionRange(this.value.length,this.value.length)" style="${inp};width:100%;max-width:360px;margin-bottom:6px">` +
      (shown.length ? shown.slice(0, showN['la-' + S.k] || 5).map((i) => libCard(i, false)).join('') + moreBtn('la-' + S.k, shown.length) : '<div class="empty">No approved notes here yet.</div>');
    if (f.sub === 'new') inner += `<div style="display:flex;flex-direction:column;gap:14px;max-width:760px">
      ${S.ideas.length ? `<div><div class="small" style="margin-bottom:6px">Quick start: tap one</div><div class="tabs" style="margin:0">${S.ideas.map(([t, w]) =>
        `<button class="${f.topic === t ? 'on' : ''}" onclick="Object.assign(libForm('${S.k}'),{topic:'${t}',words:'${w}'});render()">${t}</button>`).join('')}</div></div>` : ''}
      <div><div class="small" style="margin-bottom:6px">${S.ideas.length ? 'Or type your own topic' : '1. What do you want?'}</div>
        <input placeholder="${S.k === 'general' ? 'eg what to eat before a gym session' : 'eg protein when you have a small appetite'}" value="${esc(f.topic)}" oninput="libForm('${S.k}').topic=this.value" style="${inp};width:100%"></div>
      ${S.types.length > 1 ? `<div><div class="small" style="margin-bottom:6px">What should it make?</div><div class="tabs" style="margin:0">${S.types.map((t) =>
        `<button class="${f.type === t ? 'on' : ''}" onclick="libForm('${S.k}').type='${t}';render()">${TYPES[t]}</button>`).join('')}</div></div>` : ''}
      <div><div class="small" style="margin-bottom:6px">Find pages on a trusted site</div>
        <div class="row" style="gap:8px;flex-wrap:wrap">
          <select onchange="libForm('${S.k}').site=this.value" style="${inp}"><option value="">Pick a site</option>${allowed.map((x) => `<option value="${esc(x.domain)}" ${f.site === x.domain ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
          <input placeholder="word in the page address, eg protein" value="${esc(f.words)}" oninput="libForm('${S.k}').words=this.value" style="${inp};flex:1;min-width:180px">
          <button class="btn ghost" onclick="libFind(this,'${S.k}')" style="padding:9px 16px">Find pages</button></div></div>
      <div><div class="small" style="margin-bottom:6px">Pages to read (one link per line). Remove any you don’t want.</div>
        <textarea rows="6" placeholder="https://www.nhs.uk/..." oninput="libForm('${S.k}').links=this.value" style="${inp};width:100%;font:13px ui-monospace,Menlo,monospace">${esc(f.links)}</textarea></div>
      <div class="row" style="gap:12px;align-items:center"><button class="btn" onclick="libStart(this,'${S.k}')">Start scrape</button>
        <span class="small">${nLinks} links · about $${(nLinks * 0.004).toFixed(2)}</span></div></div>`;
    const extra = drafts.length ? `<span class="newn">${drafts.length} to check</span>` : '';
    return fold('lib-' + S.k, S.dot, S.title, S.sub, fmt(lib2.length), extra, inner);
  };
  const jobs = `<div>${lib.jobs.slice(0, showN['lj'] || 5).map((j) => {
      const pct = j.pages_total ? Math.round((j.pages_done / j.pages_total) * 100) : 0, run = lib.running[j.id];
      return `<div class="fb" style="display:block"><div class="row" style="flex-wrap:wrap;gap:8px"><b>${esc(j.topic)}</b><span class="chip">${TYPES[j.type]}</span>
          <span class="chip ${j.status === 'done' ? 'fixed' : j.status === 'running' || run ? 'in_progress' : j.status === 'failed' ? 'bug' : 'new'}">${run ? 'Reading pages…' : esc(j.status)}</span>
          <span class="small" style="margin-left:auto">${when(j.created_at)} · ${esc(j.created_by || '')}</span></div>
        <div style="height:8px;border-radius:99px;background:rgba(24,33,31,.08);margin:10px 0 6px;overflow:hidden"><div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#5FB4F0,#9C8CF2,#F29BC0)"></div></div>
        <div class="row small" style="gap:14px;flex-wrap:wrap"><span>${j.pages_done} of ${j.pages_total} pages</span><span>${j.items_made} notes made</span><span>$${Number(j.cost_usd).toFixed(3)}</span>
          ${j.error ? `<span>${esc(j.error)}</span>` : ''}
          <span style="margin-left:auto;display:flex;gap:8px">
            ${!run && j.pages_done < j.pages_total && j.status !== 'stopped' ? `<button class="btn" style="padding:6px 14px;font-size:13px" onclick="libRun('${j.id}')">Run</button>` : ''}
            ${run || j.status === 'running' || j.status === 'queued' ? `<button class="btn ghost" style="padding:6px 14px;font-size:13px" onclick="libStop('${j.id}')">Stop</button>` : ''}
            <button class="btn ghost" style="padding:6px 14px;font-size:13px" onclick="libPages('${j.id}')">${lib.openJob === j.id ? 'Hide pages' : 'Pages'}</button></span></div>
        ${lib.openJob === j.id ? `<div style="margin-top:8px">${(lib.pages[j.id] || []).map((p) => `<div class="small" style="padding:4px 0;border-top:1px solid var(--line)"><span class="chip ${p.status === 'done' ? 'fixed' : p.status === 'failed' ? 'bug' : ''}">${p.status}</span> <a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title || p.url)}</a>${p.reason ? ` · ${esc(p.reason)}` : ''}</div>`).join('')}</div>` : ''}
      </div>`; }).join('') || '<div class="empty">No scrapes yet.</div>'}${moreBtn('lj', lib.jobs.length)}</div>`;
  const sites = `<div class="wide"><table><thead><tr><th>Site</th><th>Address</th><th>Kind</th><th>Allowed</th></tr></thead><tbody>
      ${lib.sources.map((x) => `<tr><td>${esc(x.name)}</td><td>${esc(x.domain)}</td><td>${esc(x.kind)}</td>
        <td><input type="checkbox" ${x.allowed ? 'checked' : ''} onchange="libSite('${esc(x.domain)}','${esc(x.name)}','${x.kind}',this.checked)"></td></tr>`).join('')}</tbody></table></div>
      <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:14px">
        <input id="newDom" placeholder="Website address, eg bda.uk.com" style="${inp};flex:1;min-width:180px">
        <input id="newName" placeholder="Name" style="${inp};width:200px">
        <select id="newKind" style="${inp}"><option value="health">Health</option><option value="food">Food</option><option value="fitness">Fitness</option><option value="general">General</option></select>
        <button class="btn" style="padding:9px 18px" onclick="libSite($('#newDom').value,$('#newName').value,$('#newKind').value,true)">Add site</button></div>
      <div class="small" style="margin-top:8px">Only add trusted sites. The scraper also obeys each site’s robots.txt.</div>`;
  const live = lib.jobs.filter((j) => lib.running[j.id] || j.status === 'running').length;
  m.innerHTML = head('Library', 'Web pages turned into notes in our own words. Nothing is used until you approve it.') +
    (lib.msg ? `<div class="err" style="margin-bottom:12px">${esc(lib.msg)}</div>` : '') +
    `<div class="kpis">${kpi('To check', fmt(o.to_check), 'waiting for you')}${kpi('Approved', fmt(o.approved), 'across all sections')}
      ${kpi('Needs clinician', fmt(o.needs_clinician), 'approved health notes')}${kpi('Spent', '$' + Number(o.spend_usd || 0).toFixed(2), 'on DeepSeek, all time')}</div>` +
    SECTIONS.map(section).join('') +
    `<div style="height:10px"></div>` +
    fold('lib-jobs', 'var(--faint)', 'Scrapes', live ? `${live} running now` : 'Progress and cost of each run', fmt(lib.jobs.length), '', jobs) +
    fold('lib-sites', 'var(--faint)', 'Trusted sites', 'The only sites the scraper may read', fmt(allowed.length), '', sites);
}
function libData(i) {
  const d = i.data || {};
  if (i.type === 'recipe') return `<div class="small" style="margin-top:6px">${[d.servings && `Serves ${d.servings}`, d.minutes && `${d.minutes} min`, d.protein_g && `${d.protein_g} g protein`].filter(Boolean).join(' · ')}</div>
    ${(d.ingredients || []).length ? `<div class="small" style="margin-top:4px"><b>Ingredients:</b> ${d.ingredients.map((x) => esc(`${x.amount || ''} ${x.item || ''}`.trim())).join(', ')}</div>` : ''}
    ${(d.steps || []).length ? `<ol class="small" style="margin:4px 0 0 18px">${d.steps.map((x) => `<li>${esc(x)}</li>`).join('')}</ol>` : ''}`;
  if (i.type === 'workout') return `<div class="small" style="margin-top:6px">${[d.level, d.equipment, (d.muscles || []).join(', ')].filter(Boolean).map(esc).join(' · ')}</div>
    ${(d.how || []).length ? `<ol class="small" style="margin:4px 0 0 18px">${d.how.map((x) => `<li>${esc(x)}</li>`).join('')}</ol>` : ''}`;
  if (i.type === 'meal_plan') return (d.meals || []).length ? `<div class="small" style="margin-top:6px">${d.meals.map((x) => `<b>${esc(x.slot)}:</b> ${esc(x.idea)}${x.protein_g ? ` (${x.protein_g} g)` : ''}`).join('<br>')}</div>` : '';
  return '';
}
function libCard(i, editing) {
  return `<div class="panel glass" id="li-${i.id}"><div class="row" style="flex-wrap:wrap;gap:8px"><span class="chip">${TYPES[i.type]}</span>
      ${i.needs_clinician ? `<span class="chip ${i.clinician_ok ? 'fixed' : 'bug'}">${i.clinician_ok ? 'Clinician checked' : 'Needs clinician'}</span>` : ''}
      ${(i.tags || []).map((t) => `<span class="chip">${esc(t)}</span>`).join('')}
      <a class="small" style="margin-left:auto" href="${esc(i.page_url)}" target="_blank" rel="noopener">Source: ${esc(i.source_domain)}</a></div>
    ${editing ? `<input id="t-${i.id}" value="${esc(i.title)}" style="width:100%;margin-top:10px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);font:inherit;font-weight:600;font-size:16px">
      <textarea id="b-${i.id}" rows="3" style="width:100%;margin-top:8px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);font:inherit;font-size:14px">${esc(i.body)}</textarea>`
      : `<div style="margin-top:8px;font-weight:600">${esc(i.title)}</div><div style="margin-top:4px;font-size:14px">${esc(i.body)}</div>`}
    ${libData(i)}
    <div class="row" style="gap:8px;margin-top:10px;flex-wrap:wrap">
      ${editing ? `<button class="btn" style="padding:7px 16px;font-size:13px" onclick="libReview('${i.id}','approved')">Approve</button>` : `<button class="btn ghost" style="padding:7px 16px;font-size:13px" onclick="libReview('${i.id}','draft')">Back to check</button>`}
      ${i.needs_clinician ? `<label class="small row" style="gap:6px"><input type="checkbox" ${i.clinician_ok ? 'checked' : ''} onchange="libClin('${i.id}',this.checked)"> Clinician checked</label>` : ''}
      <button class="btn ghost" style="padding:7px 16px;font-size:13px;margin-left:auto" onclick="libReview('${i.id}','binned')">Bin</button>
      <span class="small">${i.reviewed_by ? `Last checked by ${esc(i.reviewed_by)} · ${ago(i.reviewed_at)}` : `Made ${ago(i.created_at)}`}</span></div></div>`;
}
async function libReview(id, status) {
  const t = $('#t-' + id), b = $('#b-' + id);
  const { error } = await SB.rpc('admin_lib_review', { p_item: id, p_status: status, p_title: t ? t.value : null, p_body: b ? b.value : null, p_clinician_ok: null });
  if (error) return libSay('Could not save that. Try again.');
  libLoad();
}
async function libClin(id, on) {
  const it = [...lib.items, ...lib.approved].find((x) => x.id === id);
  const { error } = await SB.rpc('admin_lib_review', { p_item: id, p_status: it.status, p_title: null, p_body: null, p_clinician_ok: on });
  if (error) return libSay('Could not save that. Try again.');
  it.clinician_ok = on; libLoad();
}
async function libSite(domain, name, kind, allowed) {
  const { error } = await SB.rpc('admin_lib_set_source', { p_domain: domain, p_name: name, p_kind: kind, p_allowed: allowed });
  if (error) return libSay(error.message.includes('website') ? 'That doesn’t look like a website address.' : 'Could not save the site. Try again.');
  libLoad();
}
async function libFind(btn, k) {
  const f = libForm(k);
  if (!f.site) return libSay('Pick a site first.');
  btn.disabled = true; btn.textContent = 'Looking…';
  const { data: r, error } = await SB.functions.invoke('library-scrape', { body: { action: 'find', domain: f.site, words: f.words } });
  btn.disabled = false; btn.textContent = 'Find pages';
  if (error || r?.error) return libSay(r?.error || 'Could not read that site’s page list. Paste links instead.');
  if (!r.links.length) return libSay('No pages matched those words. Try fewer or different words.');
  f.links = [...new Set([...f.links.split('\n').map((x) => x.trim()).filter(Boolean), ...r.links])].join('\n');
  lib.msg = `Found ${r.links.length} pages. Remove any you don’t want, then press Start scrape.`; render();
}
async function libStart(btn, k) {
  const f = libForm(k), urls = f.links.split('\n').map((x) => x.trim()).filter(Boolean);
  if (!f.topic.trim()) return libSay('Add a topic first.');
  btn.disabled = true;
  const { data: id, error } = await SB.rpc('admin_lib_create_job', { p_topic: (k === 'general' ? GEN : '') + f.topic.trim(), p_type: f.type, p_urls: urls });
  btn.disabled = false;
  if (error) return libSay(error.message.includes('topic') ? 'Add a topic first.' : error.message.includes('link') ? 'Add at least one web link (starting https://).' : 'Could not start the scrape. Try again.');
  f.topic = ''; f.links = ''; f.sub = 'check'; openSet.add('lib-jobs'); lib.msg = '';
  await libLoad(); libRun(id);
}
async function libRun(id) {
  lib.running[id] = true; render();
  for (let k = 0; k < 80 && lib.running[id]; k++) {
    const { data: r, error } = await SB.functions.invoke('library-scrape', { body: { action: 'run', job_id: id } });
    if (error || r?.error) { lib.running[id] = false; return libSay(r?.error || 'The scraper stopped with an error. Press Run to carry on.'); }
    const j = await SB.rpc('admin_lib_jobs'); lib.jobs = j.data || lib.jobs;
    if (lib.openJob === id) lib.pages[id] = (await SB.rpc('admin_lib_job_pages', { p_job: id })).data || [];
    if (view === 'library') render();
    if (!r.remaining) break;
  }
  lib.running[id] = false; libLoad();
}
async function libStop(id) { lib.running[id] = false; await SB.rpc('admin_lib_stop_job', { p_job: id }); libLoad(); }
async function libPages(id) {
  if (lib.openJob === id) { lib.openJob = null; return render(); }
  lib.openJob = id; lib.pages[id] = (await SB.rpc('admin_lib_job_pages', { p_job: id })).data || []; render();
}
function go(v) { document.querySelector(`.nav[data-v="${v}"]`).click(); }
async function setStatus(id, s) {
  const { error } = await SB.rpc('admin_set_feedback_status', { feedback_id: id, new_status: s });
  if (error) { document.querySelector('#main').insertAdjacentHTML('afterbegin', '<div class="err" style="margin-bottom:12px">Could not save that change. Try again.</div>'); return; }
  const f = data.fb.find((x) => x.id === id); if (f) f.status = s;
  const n = data.fb.filter((x) => x.status === 'new' && !noise(x)).length; $('#fbN').textContent = n; $('#fbN').style.display = n ? 'inline-block' : 'none';
  render();
}
start();
</script>
